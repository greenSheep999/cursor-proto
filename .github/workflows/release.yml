name: release

# Tag scheme: cursor<major>.<minor>/v<semver>, e.g.
#   cursor3.10/v0.1.1
#   cursor3.11/v0.2.0
#   cursor3.15/v0.4.0
#
# See docs/versioning.md for the full contract. The legacy flat tag
# `v*.*.*` is grandfathered for the initial v0.1.0 release; new
# Cursor lines must use the prefixed form.

on:
  push:
    tags:
      - "cursor*/v*.*.*"
      - "v*.*.*"  # grandfathered; treated as cursor3.10

permissions:
  contents: write

jobs:
  meta:
    name: parse tag
    runs-on: ubuntu-latest
    outputs:
      cursor_line: ${{ steps.parse.outputs.cursor_line }}
      semver: ${{ steps.parse.outputs.semver }}
      release_name: ${{ steps.parse.outputs.release_name }}
    steps:
      - id: parse
        # Tag comes in as one of:
        #   cursor3.10/v0.1.1  →  cursor_line=cursor3.10, semver=v0.1.1
        #   cursor3.11/v0.2.0  →  cursor_line=cursor3.11, semver=v0.2.0
        #   cursor3.15/v0.4.0  →  cursor_line=cursor3.15, semver=v0.4.0
        #   v0.1.0             →  cursor_line=cursor3.10, semver=v0.1.0 (legacy)
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if [[ "${REF}" == cursor*/v*.*.* ]]; then
            LINE="${REF%%/*}"
            SEMVER="${REF#*/}"
          elif [[ "${REF}" == v*.*.* ]]; then
            LINE="cursor3.10"
            SEMVER="${REF}"
          else
            echo "unrecognized tag: ${REF}" >&2
            exit 1
          fi
          echo "cursor_line=${LINE}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "release_name=cursor-proxy ${LINE} ${SEMVER}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ needs.meta.outputs.cursor_line }} ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            apt: libsqlite3-dev
          - name: linux-arm64
            # Native arm64 hosted runner. Public repos get this for free; on
            # private repos it may need to be enabled in Actions settings.
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            apt: libsqlite3-dev
          - name: darwin-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            apt: ""
          - name: darwin-amd64
            # Intel Mac target so cursor2api's x86_64 DMG can bundle the
            # sidecar. Use GitHub's current Intel-hosted macOS label.
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            apt: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install CGO deps (Linux)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CURSOR_LINE: ${{ needs.meta.outputs.cursor_line }}
          # GITHUB_REF_NAME is the raw tag (e.g. cursor3.11/v0.2.1) — that's
          # exactly what we want to see reported by /v1/proxy-info and
          # `cursor-proxy -version`, so downstream can confirm they got
          # the release they pinned.
          PROTO_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Artifact naming: cursor-proxy-<cursor-line>-<goos>-<goarch>.
          # The <cursor-line> segment is intentionally kept in the filename
          # so cursor2api can download 3.10 and 3.11 side by side into the
          # same directory without collision. See docs/versioning.md.
          go build -trimpath \
            -ldflags="-s -w -X main.ProtoVersion=${PROTO_TAG}" \
            -o "dist/cursor-proxy-${CURSOR_LINE}-${{ matrix.name }}" \
            ./cmd/cursor-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-proxy-${{ needs.meta.outputs.cursor_line }}-${{ matrix.name }}
          path: dist/cursor-proxy-${{ needs.meta.outputs.cursor_line }}-${{ matrix.name }}
          if-no-files-found: error

  # Build the Node runner bundle exactly once — it's pure JS, so the
  # output is platform-independent. All four per-platform bundles below
  # download the same node-runner-bundle artifact and pair it with their
  # per-platform Go binary into a single tarball.
  node-runner:
    name: build node-runner bundle
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-runner/package-lock.json

      - name: Install & compile
        working-directory: node-runner
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          # Trim dev deps so the bundle stays small (~10-15 MB
          # instead of ~50 MB with tsx / typescript / @types).
          npm prune --production --no-audit --no-fund

      - name: Assemble bundle directory
        run: |
          set -euo pipefail
          mkdir -p bundle/cursor-node-runner
          cp -R node-runner/dist         bundle/cursor-node-runner/dist
          cp -R node-runner/node_modules bundle/cursor-node-runner/node_modules
          cp    node-runner/package.json bundle/cursor-node-runner/package.json
          cp    node-runner/README.md    bundle/cursor-node-runner/README.md

      - name: Upload node-runner bundle
        uses: actions/upload-artifact@v4
        with:
          name: cursor-node-runner-bundle
          path: bundle/
          if-no-files-found: error

  # Per-platform tarball: Go binary + node-runner bundle in one archive.
  # This is the "everything you need for agent mode" artifact. The raw
  # per-platform Go binary above (uploaded by the `build` job) stays
  # so cursor2api's existing single-file download keeps working.
  tarball:
    name: tarball ${{ matrix.name }}
    needs: [meta, build, node-runner]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,  ext: "" }
          - { name: linux-arm64,  ext: "" }
          - { name: darwin-arm64, ext: "" }
          - { name: darwin-amd64, ext: "" }
    steps:
      - name: Download Go binary
        uses: actions/download-artifact@v4
        with:
          name: cursor-proxy-${{ needs.meta.outputs.cursor_line }}-${{ matrix.name }}
          path: staging/

      - name: Download node runner bundle
        uses: actions/download-artifact@v4
        with:
          name: cursor-node-runner-bundle
          path: staging/

      - name: Compose tarball
        env:
          CURSOR_LINE: ${{ needs.meta.outputs.cursor_line }}
        run: |
          set -euo pipefail
          # Layout inside the tarball:
          #   cursor-proxy-<line>-<platform>/
          #     cursor-proxy            (executable, renamed for portability)
          #     cursor-node-runner/     (bundled Node runner)
          #     README                  (how to run)
          NAME="cursor-proxy-${CURSOR_LINE}-${{ matrix.name }}"
          mkdir -p "out/${NAME}"
          # Rename the platform-suffixed Go binary to a plain
          # `cursor-proxy` inside the tarball — one less thing for
          # users to remember.
          cp "staging/cursor-proxy-${CURSOR_LINE}-${{ matrix.name }}" "out/${NAME}/cursor-proxy"
          chmod +x "out/${NAME}/cursor-proxy"
          cp -R staging/cursor-node-runner "out/${NAME}/cursor-node-runner"
          cat > "out/${NAME}/README" <<EOF
          cursor-proxy ${CURSOR_LINE} ${{ needs.meta.outputs.semver }} (${{ matrix.name }})

          Wire mode (default):
            ./cursor-proxy -addr 127.0.0.1:8317

          Agent mode (optional; requires Cursor dashboard API key):
            CURSOR_API_KEY=crsr_your_key ./cursor-proxy \\
              -addr 127.0.0.1:8317 \\
              -node-runner ./cursor-node-runner/dist/index.js

          See https://github.com/greenSheep999/cursor-proto for docs.
          EOF
          tar -czf "${NAME}.tar.gz" -C out "${NAME}"
          ls -lh "${NAME}.tar.gz"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: cursor-proxy-${{ needs.meta.outputs.cursor_line }}-${{ matrix.name }}-tarball
          path: cursor-proxy-${{ needs.meta.outputs.cursor_line }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [meta, build, tarball]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach:
          #   - the raw per-platform Go binaries (cursor-proxy-<line>-<platform>)
          #     for cursor2api and other consumers that already download
          #     single files by pattern
          #   - the .tar.gz bundles that include the node-runner for
          #     users who want agent mode without assembling the pieces
          #     themselves
          # The `cursor-proxy-<line>-*` glob catches BOTH shapes because
          # tarball filenames also start with that prefix.
          files: dist/cursor-proxy-${{ needs.meta.outputs.cursor_line }}-*
          name: ${{ needs.meta.outputs.release_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
