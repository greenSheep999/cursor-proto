name: docker-image

# Build multi-arch cursor-proxy images and push to GHCR.
#
# Tag scheme (see docs/versioning.md for the full contract):
#   - push to main                       → tags: latest, main-<sha>
#     (`latest` tracks whichever Cursor line main is currently on)
#   - push to release/cursor-<X.Y>       → tags: cursor<X.Y>-latest, cursor<X.Y>-<sha>
#   - push cursor<X.Y>/v*.*.* tag        → tags: cursor<X.Y>-<semver>, cursor<X.Y>-latest
#     (when X.Y == LATEST_CURSOR_LINE, also refresh: latest)
#   - push legacy v*.*.* tag             → treated as cursor3.10; tags: cursor3.10-<semver>, cursor3.10-latest, <semver>
#   - workflow_dispatch                  → tag: manual-<sha>
#
# `latest` (unqualified) is an alias for whichever Cursor line is
# currently primary. Both `main` pushes and tag pushes on the primary
# line refresh it; older lines keep their `cursor<X.Y>-latest` alias
# but never overwrite `latest`. To promote a new primary line, bump
# `LATEST_CURSOR_LINE` below. Production consumers should pin to
# `cursor<X.Y>-latest` or `cursor<X.Y>-<semver>`, never bare `latest`.

on:
  push:
    branches:
      - main
      - "release/cursor-*"
    tags:
      - "cursor*/v*.*.*"
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cursor-proxy
  # Primary Cursor line — the one bare `latest` follows on tag pushes.
  # Bump this in the same commit that promotes a new primary line.
  LATEST_CURSOR_LINE: cursor3.11

permissions:
  contents: read
  packages: write

jobs:
  meta:
    name: parse ref
    runs-on: ubuntu-latest
    outputs:
      cursor_line: ${{ steps.parse.outputs.cursor_line }}
      semver: ${{ steps.parse.outputs.semver }}
      is_latest_line: ${{ steps.parse.outputs.is_latest_line }}
    steps:
      - id: parse
        # Sets:
        #   cursor_line     — cursor<X.Y> (never empty; falls back to cursor3.10 for legacy)
        #   semver          — v<x.y.z> when this is a tag push, else empty
        #   is_latest_line  — "true" iff this ref is on `main` (the current Cursor line);
        #                     used to decide whether to also tag as bare `latest`.
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          NAME="${GITHUB_REF_NAME}"
          LINE=""
          SEMVER=""
          IS_LATEST_LINE="false"

          if [[ "${REF}" == refs/tags/cursor*/v*.*.* ]]; then
            LINE="${NAME%%/*}"
            SEMVER="${NAME#*/}"
          elif [[ "${REF}" == refs/tags/v*.*.* ]]; then
            LINE="cursor3.10"
            SEMVER="${NAME}"
          elif [[ "${REF}" == refs/heads/release/cursor-* ]]; then
            # refs/heads/release/cursor-3.10 → cursor3.10
            SUFFIX="${NAME#release/cursor-}"
            LINE="cursor${SUFFIX}"
          elif [[ "${REF}" == refs/heads/main ]]; then
            # main tracks the current Cursor line. We don't try to parse
            # which one it is from the ref alone; the `latest` alias is
            # what casual users pull, and pinned consumers use the
            # cursor<X.Y>-* tags produced from the release branches.
            LINE="main"
            IS_LATEST_LINE="true"
          else
            LINE="manual"
          fi

          echo "cursor_line=${LINE}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "is_latest_line=${IS_LATEST_LINE}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (per-arch)
        id: tags
        env:
          CURSOR_LINE: ${{ needs.meta.outputs.cursor_line }}
          SEMVER: ${{ needs.meta.outputs.semver }}
          IS_LATEST_LINE: ${{ needs.meta.outputs.is_latest_line }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          SHA=${GITHUB_SHA::7}
          ARCH=${{ matrix.arch }}

          # Always at least one per-arch tag so the manifest job has
          # something to stitch. Non-release refs get sha-only tags.
          TAGS="${IMG}:sha-${SHA}-${ARCH}"

          if [[ "${GITHUB_REF}" == refs/tags/cursor*/v*.*.* || "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            TAGS="${TAGS},${IMG}:${CURSOR_LINE}-${SEMVER}-${ARCH}"
            TAGS="${TAGS},${IMG}:${CURSOR_LINE}-latest-${ARCH}"
            # Preserve the flat semver alias only for the legacy v*.*.* path
            # so nothing that pinned `:v0.1.0` under the old scheme breaks.
            if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
              TAGS="${TAGS},${IMG}:${SEMVER}-${ARCH}"
            fi
            # Tag pushes on the primary Cursor line also refresh bare `latest`.
            if [[ "${CURSOR_LINE}" == "${LATEST_CURSOR_LINE}" ]]; then
              TAGS="${TAGS},${IMG}:latest-${ARCH}"
            fi
          elif [[ "${GITHUB_REF}" == refs/heads/release/cursor-* ]]; then
            TAGS="${TAGS},${IMG}:${CURSOR_LINE}-latest-${ARCH}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="${TAGS},${IMG}:latest-${ARCH}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Compute PROTO_VERSION build-arg
        id: proto_ver
        # Stamped into the binary and reported by /v1/proxy-info. Tags
        # get the full ref name (cursor3.11/v0.2.1); branch builds get
        # a branch-<sha> marker so the endpoint still surfaces something
        # meaningful for "latest" images.
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PROTO_VERSION=${{ steps.proto_ver.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch manifests
        env:
          CURSOR_LINE: ${{ needs.meta.outputs.cursor_line }}
          SEMVER: ${{ needs.meta.outputs.semver }}
          IS_LATEST_LINE: ${{ needs.meta.outputs.is_latest_line }}
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          SHA=${GITHUB_SHA::7}

          stitch() {
            local TAG="$1"
            docker buildx imagetools create \
              --tag "${IMG}:${TAG}" \
              "${IMG}:sha-${SHA}-amd64" \
              "${IMG}:sha-${SHA}-arm64"
          }

          # sha-<sha> multi-arch (always)
          stitch "sha-${SHA}"

          if [[ "${GITHUB_REF}" == refs/tags/cursor*/v*.*.* || "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            stitch "${CURSOR_LINE}-${SEMVER}"
            stitch "${CURSOR_LINE}-latest"
            if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
              stitch "${SEMVER}"
            fi
            # Tag pushes on the primary Cursor line also refresh bare `latest`.
            if [[ "${CURSOR_LINE}" == "${LATEST_CURSOR_LINE}" ]]; then
              stitch "latest"
            fi
          elif [[ "${GITHUB_REF}" == refs/heads/release/cursor-* ]]; then
            stitch "${CURSOR_LINE}-latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            stitch "latest"
          fi

  notify-oss:
    # Fires after a successful release build so the downstream
    # cursor-proxy-oss repo can sync its README/compose/tag to the
    # new upstream version. Requires an OSS_SYNC_TOKEN secret — a
    # fine-grained PAT with Contents:read/write on cursor-proxy-oss.
    needs: [meta, manifest]
    if: startsWith(github.ref, 'refs/tags/cursor') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upstream-release event to cursor-proxy-oss
        env:
          GH_TOKEN: ${{ secrets.OSS_SYNC_TOKEN }}
          UPSTREAM_TAG: ${{ github.ref_name }}
          CURSOR_LINE: ${{ needs.meta.outputs.cursor_line }}
          SEMVER: ${{ needs.meta.outputs.semver }}
          IS_PRIMARY_LINE: ${{ needs.meta.outputs.cursor_line == env.LATEST_CURSOR_LINE && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::OSS_SYNC_TOKEN not set — skipping downstream sync"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg tag "${UPSTREAM_TAG}" \
            --arg line "${CURSOR_LINE}" \
            --arg semver "${SEMVER}" \
            --arg primary "${IS_PRIMARY_LINE}" \
            '{event_type: "upstream-release",
              client_payload: {
                upstream_tag: $tag,
                cursor_line:  $line,
                semver:       $semver,
                is_primary:   $primary
              }}')

          echo "Dispatching upstream-release for ${UPSTREAM_TAG} (primary=${IS_PRIMARY_LINE})"
          curl -sSfL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/greensheep999/cursor-proxy-oss/dispatches \
            -d "${PAYLOAD}"
